<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理パネル — Mahjong</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1c2128;
      --border: #30363d;
      --border2: #21262d;
      --text: #e6edf3;
      --text2: #8b949e;
      --text3: #484f58;
      --blue: #2f81f7;
      --blue-bg: #1f3a5c;
      --green: #3fb950;
      --green-bg: #1a3a20;
      --red: #f85149;
      --red-bg: #3a1a1a;
      --yellow: #d29922;
      --yellow-bg: #2a2310;
      --purple: #bc8cff;
      --code-bg: #161b22;
      --radius: 8px;
      --radius-sm: 5px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', 'Meiryo', sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 48px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .login-subtitle {
      text-align: center;
      font-size: 12px;
      color: var(--text2);
      margin-top: -12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
    }

    .field input, .field select, .field textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      font-family: inherit;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--blue);
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, opacity 0.15s;
      color: #fff;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.15); }
    .btn:active:not(:disabled) { filter: brightness(0.9); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary  { background: var(--blue); }
    .btn-danger   { background: #a02020; border: 1px solid var(--red); }
    .btn-ghost    { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text2); color: var(--text); }
    .btn-success  { background: #1a522a; border: 1px solid var(--green); }
    .btn-sm       { padding: 4px 10px; font-size: 12px; }
    .btn-xs       { padding: 2px 8px; font-size: 11px; }
    .btn-block    { width: 100%; }

    .alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
    }

    .alert-error   { background: var(--red-bg); border: 1px solid #5a2020; color: var(--red); }
    .alert-success { background: var(--green-bg); border: 1px solid #1a5a28; color: var(--green); }
    .alert-info    { background: var(--blue-bg); border: 1px solid #1a3a6a; color: #79c0ff; }

    /* ── MAIN LAYOUT ── */
    #main-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .session-info {
      font-size: 11px;
      color: var(--text3);
    }

    /* ── TABS ── */
    .tab-nav {
      display: flex;
      gap: 2px;
      padding: 0 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 10px 18px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      margin-bottom: -1px;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

    /* ── CONTENT ── */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      min-height: 0;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: flex; flex-direction: column; gap: 18px; }

    /* ── CARDS ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .card-body {
      padding: 16px;
    }

    /* ── FORM GRID ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid .full { grid-column: 1 / -1; }
    .form-grid .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-end; justify-content: flex-end; }

    /* ── TABLE ── */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background: var(--bg3);
      color: var(--text2);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border2);
      vertical-align: top;
      color: var(--text);
      word-break: break-all;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #ffffff05; }

    /* ── CODE / BADGES ── */
    code, .mono {
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 11px;
      background: var(--code-bg);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 1px 5px;
      color: #79c0ff;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge-red    { background: var(--red-bg); color: var(--red); border: 1px solid #5a2020; }
    .badge-blue   { background: var(--blue-bg); color: #79c0ff; border: 1px solid #1a3a6a; }
    .badge-green  { background: var(--green-bg); color: var(--green); border: 1px solid #1a5a28; }
    .badge-gray   { background: #21262d; color: var(--text2); border: 1px solid var(--border2); }

    /* ── STATS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
    }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 32px;
      color: var(--text3);
      font-size: 13px;
    }

    /* ── HINT ── */
    .hint {
      font-size: 11px;
      color: var(--text3);
      font-style: italic;
    }

    /* ── NOTE ── */
    .note {
      font-size: 11px;
      color: var(--text3);
      padding: 8px 12px;
      background: var(--bg3);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--border);
    }

    /* ── USER DB ENTRY ── */
    .user-card {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .user-card-info { flex: 1; min-width: 0; }
    .user-card-names { font-weight: 600; color: var(--text); font-size: 13px; margin-bottom: 4px; }
    .user-card-details { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--text2); margin-top: 4px; }
    .user-card-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════ LOGIN ═══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-title">🀄 管理パネル</div>
    <p class="login-subtitle">Mahjong Server — Admin Panel</p>
    <div class="field">
      <label>管理者パスワード</label>
      <input id="login-pw" type="password" placeholder="パスワードを入力" autocomplete="current-password">
    </div>
    <div id="login-error" class="alert alert-error" style="display:none;"></div>
    <button class="btn btn-primary btn-block" id="login-btn" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════  MAIN ═══ -->
<div id="main-screen">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-title">🀄 管理パネル</div>
    <div class="top-bar-right">
      <span class="session-info" id="session-info"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-ban" onclick="switchTab('ban')">🚫 BANリスト</button>
    <button class="tab-btn" id="tab-users" onclick="switchTab('users')">👥 ユーザーDB</button>
    <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">📊 サーバー状況</button>
    <button class="tab-btn" id="tab-settings" onclick="switchTab('settings')">⚙️ 設定</button>
  </div>

  <!-- Content -->
  <div class="tab-content">

    <!-- ══════════ BAN LIST ══════════ -->
    <div class="tab-panel active" id="panel-ban">

      <!-- Add Form -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🚫 BAN追加</span>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field">
              <label>IPアドレス <span class="hint">（ * でワイルドカード: 例 192.168.1.*）</span></label>
              <input id="ban-ip" type="text" placeholder="192.168.1.* または空白" autocomplete="off">
            </div>
            <div class="field">
              <label>フィンガープリント <span class="hint">（ * でワイルドカード: 例 abc123*）</span></label>
              <input id="ban-fp" type="text" placeholder="32桁HEX / ワイルドカード / 空白" autocomplete="off">
            </div>
            <div class="field full">
              <label>理由</label>
              <input id="ban-reason" type="text" placeholder="BAN理由（任意）" autocomplete="off">
            </div>
            <div class="note full">
              ※ IPとFPを両方指定した場合は <strong>AND条件</strong>（両方一致でBAN）。いずれか一方のみでも可。
            </div>
            <div class="actions">
              <button class="btn btn-danger" onclick="addBan()">🚫 BANを追加</button>
            </div>
          </div>
        </div>
      </div>

      <!-- List -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">BANリスト</span>
          <button class="btn btn-ghost btn-sm" onclick="loadBanList()">↻ 更新</button>
        </div>
        <div id="ban-list-container">
          <div class="empty">読み込み中…</div>
        </div>
      </div>
    </div>

    <!-- ══════════ USER DB ══════════ -->
    <div class="tab-panel" id="panel-users">
      <div class="card">
        <div class="card-header">
          <span class="card-title">ユーザーデータベース</span>
          <button class="btn btn-ghost btn-sm" onclick="loadUserDB()">↻ 更新</button>
        </div>
        <div class="card-body" id="user-db-container">
          <div class="empty">読み込み中…</div>
        </div>
      </div>
    </div>

    <!-- ══════════ STATS ══════════ -->
    <div class="tab-panel" id="panel-stats">
      <div id="stats-container">
        <div class="empty">読み込み中…</div>
      </div>
    </div>

    <!-- ══════════ SETTINGS ══════════ -->
    <div class="tab-panel" id="panel-settings">
      <div class="card" style="max-width:460px;">
        <div class="card-header">
          <span class="card-title">🔑 パスワード変更</span>
        </div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">
          <div class="field">
            <label>現在のパスワード</label>
            <input id="pw-current" type="password" autocomplete="current-password">
          </div>
          <div class="field">
            <label>新しいパスワード <span class="hint">（4文字以上）</span></label>
            <input id="pw-new" type="password" autocomplete="new-password">
          </div>
          <div class="field">
            <label>新しいパスワード（確認）</label>
            <input id="pw-confirm" type="password" autocomplete="new-password">
          </div>
          <div id="pw-msg" style="display:none;"></div>
          <button class="btn btn-primary" onclick="changePassword()">パスワードを変更</button>
          <p class="note">パスワードを変更すると、現在ログイン中のすべてのセッションが無効になります。変更後は再ログインが必要です。</p>
        </div>
      </div>
    </div>

  </div><!-- /tab-content -->
</div><!-- /main-screen -->

<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
// 現在のURLからベースパスを自動検出する。
// 例: /mjadmin/   → API = ''
// 例: /mj/mjadmin/ → API = '/mj'（nginxで/mj/プレフィックスを付けた場合）
const API = window.location.pathname.replace(/\/mjadmin\/?.*$/, '');

// ── State ───────────────────────────────────────────────────────────────────
let token = sessionStorage.getItem('admin-token') || null;
let tokenCreatedAt = parseInt(sessionStorage.getItem('admin-token-ts') || '0');
const SESSION_TTL_MS = 8 * 60 * 60 * 1000;

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
  if (token && Date.now() - tokenCreatedAt < SESSION_TTL_MS) {
    try {
      const r = await apiFetch('GET', `${API}/mjadmin/api/me`);
      if (r.authenticated) { showMain(); return; }
    } catch {}
  }
  showLogin();
})();

// ── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!pw) return;

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetchJSON('POST', `${API}/mjadmin/api/login`, { password: pw });
    token = res.token;
    tokenCreatedAt = Date.now();
    sessionStorage.setItem('admin-token', token);
    sessionStorage.setItem('admin-token-ts', String(tokenCreatedAt));
    showMain();
  } catch (err) {
    errEl.textContent = err.message || 'ログインに失敗しました';
    errEl.style.display = '';
  }
  btn.disabled = false;
  btn.textContent = 'ログイン';
}

async function doLogout() {
  try { await apiFetch('POST', `${API}/mjadmin/api/logout`); } catch {}
  sessionStorage.removeItem('admin-token');
  sessionStorage.removeItem('admin-token-ts');
  token = null;
  showLogin();
}

function showLogin() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-error').style.display = 'none';

  document.getElementById('login-pw').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  }, { once: true });
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';

  // セッション残り時間を表示
  const remaining = SESSION_TTL_MS - (Date.now() - tokenCreatedAt);
  const hours = Math.floor(remaining / 3600000);
  const mins = Math.floor((remaining % 3600000) / 60000);
  document.getElementById('session-info').textContent = `セッション残り: ${hours}h${mins}m`;

  loadBanList();
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
let currentTab = 'ban';

function switchTab(tab) {
  if (currentTab === tab) return;
  document.getElementById(`panel-${currentTab}`).classList.remove('active');
  document.getElementById(`tab-${currentTab}`).classList.remove('active');
  currentTab = tab;
  document.getElementById(`panel-${tab}`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');

  if (tab === 'ban') loadBanList();
  if (tab === 'users') loadUserDB();
  if (tab === 'stats') loadStats();
}

// ── API Helpers ───────────────────────────────────────────────────────────────
async function fetchJSON(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function apiFetch(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) {
    sessionStorage.removeItem('admin-token');
    sessionStorage.removeItem('admin-token-ts');
    token = null;
    showLogin();
    throw new Error('セッションが切れました。再ログインしてください。');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

// ── BAN LIST ──────────────────────────────────────────────────────────────────
async function loadBanList() {
  const container = document.getElementById('ban-list-container');
  try {
    const list = await apiFetch('GET', `${API}/mjadmin/api/ban-list`);
    if (!Array.isArray(list) || list.length === 0) {
      container.innerHTML = '<div class="empty">BANリストは空です</div>';
      return;
    }

    const rows = list.map(e => `
      <tr>
        <td>${e.ip ? `<code>${esc(e.ip)}</code>` : '<span style="color:var(--text3)">—</span>'}</td>
        <td>${e.fingerprint ? `<code>${esc(e.fingerprint)}</code>` : '<span style="color:var(--text3)">—</span>'}</td>
        <td>${e.reason ? esc(e.reason) : '<span style="color:var(--text3)">—</span>'}</td>
        <td style="white-space:nowrap;color:var(--text2);">${fmtDate(e.createdAt)}</td>
        <td>
          <button class="btn btn-danger btn-xs" onclick="deleteBan('${esc(e.id)}')">削除</button>
        </td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>IP / パターン</th>
              <th>フィンガープリント</th>
              <th>理由</th>
              <th>登録日時</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  } catch (err) {
    container.innerHTML = `<div class="empty" style="color:var(--red)">読み込み失敗: ${esc(err.message)}</div>`;
  }
}

async function addBan() {
  const ip     = document.getElementById('ban-ip').value.trim();
  const fp     = document.getElementById('ban-fp').value.trim();
  const reason = document.getElementById('ban-reason').value.trim();

  if (!ip && !fp) {
    alert('IPアドレスまたはフィンガープリントのいずれかを入力してください');
    return;
  }
  try {
    await apiFetch('POST', `${API}/mjadmin/api/ban-list`, { ip: ip || null, fingerprint: fp || null, reason });
    document.getElementById('ban-ip').value = '';
    document.getElementById('ban-fp').value = '';
    document.getElementById('ban-reason').value = '';
    await loadBanList();
  } catch (err) {
    alert(`BAN追加失敗: ${err.message}`);
  }
}

async function deleteBan(id) {
  if (!confirm('このBANエントリを削除しますか？')) return;
  try {
    await apiFetch('DELETE', `${API}/mjadmin/api/ban-list/${id}`);
    await loadBanList();
  } catch (err) {
    alert(`削除失敗: ${err.message}`);
  }
}

// ── USER DB ─────────────────────────────────────────────────────────────────
async function loadUserDB() {
  const container = document.getElementById('user-db-container');
  container.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const list = await apiFetch('GET', `${API}/mjadmin/api/user-database`);
    if (!Array.isArray(list) || list.length === 0) {
      container.innerHTML = '<div class="empty">データなし</div>';
      return;
    }

    const cards = list.map((u, idx) => {
      const names = u.names.join(', ') || '—';
      const ipsHtml = u.ips.map(ip => `<code>${esc(ip)}</code>`).join(' ');
      const fpsHtml = u.fingerprints.map(fp => `<code title="${esc(fp)}">${esc(fp.slice(0,12))}…</code>`).join(' ');
      const banBtns = [];
      u.ips.forEach(ip => {
        banBtns.push(`<button class="btn btn-danger btn-xs" onclick="quickBan('${esc(ip)}','','${esc(names)}')">IP BAN</button>`);
      });
      u.fingerprints.forEach(fp => {
        banBtns.push(`<button class="btn btn-danger btn-xs" onclick="quickBan('','${esc(fp)}','${esc(names)}')">FP BAN</button>`);
      });
      if (u.ips.length > 0 && u.fingerprints.length > 0) {
        banBtns.push(`<button class="btn btn-danger btn-xs" onclick="quickBan('${esc(u.ips[0])}','${esc(u.fingerprints[0])}','${esc(names)}')">IP+FP BAN</button>`);
      }

      return `
        <div class="user-card">
          <div class="user-card-info">
            <div class="user-card-names">${esc(names)}</div>
            <div class="user-card-details">
              <span>IP: ${ipsHtml}</span>
              ${u.fingerprints.length ? `<span>FP: ${fpsHtml}</span>` : ''}
              <span style="color:var(--text3)">初: ${fmtDate(u.firstSeen)} / 最終: ${fmtDate(u.lastSeen)}</span>
            </div>
          </div>
          <div class="user-card-actions">${banBtns.join('')}</div>
        </div>
      `;
    }).join('');

    container.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">${cards}</div>`;
  } catch (err) {
    container.innerHTML = `<div class="empty" style="color:var(--red)">読み込み失敗: ${esc(err.message)}</div>`;
  }
}

async function quickBan(ip, fp, names) {
  const reason = prompt(`BAN理由を入力（ユーザー名: ${names}）`, '') ?? '';
  if (reason === null) return; // cancel
  try {
    await apiFetch('POST', `${API}/mjadmin/api/ban-list`, {
      ip: ip || null,
      fingerprint: fp || null,
      reason,
    });
    alert(`BANしました: ${ip ? `IP=${ip}` : `FP=${fp}`}`);
    loadUserDB();
  } catch (err) {
    alert(`BAN失敗: ${err.message}`);
  }
}

// ── STATS ────────────────────────────────────────────────────────────────────
async function loadStats() {
  const container = document.getElementById('stats-container');
  container.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const s = await apiFetch('GET', `${API}/mjadmin/api/stats`);

    let activeRoomsHtml = '';
    if (s.activeRooms && s.activeRooms.length > 0) {
      const rows = s.activeRooms.map(r => `
        <tr>
          <td><code>${esc(r.roomId)}</code></td>
          <td>${r.players.map(p => esc(p)).join(', ')}</td>
          <td>${r.connectedCount} / 2</td>
          <td>${r.spectatorCount || 0}</td>
          <td><span class="badge ${r.status === 'playing' ? 'badge-blue' : 'badge-gray'}">${esc(r.status)}</span></td>
          <td style="color:var(--text2);font-size:11px;">${fmtDate(new Date(r.createdAt).toISOString())}</td>
        </tr>
      `).join('');
      activeRoomsHtml = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">アクティブルーム</span>
            <button class="btn btn-ghost btn-sm" onclick="loadStats()">↻ 更新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ルームID</th><th>プレイヤー</th><th>接続数</th><th>観戦者</th><th>ステータス</th><th>作成日時</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    } else {
      activeRoomsHtml = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">アクティブルーム</span>
            <button class="btn btn-ghost btn-sm" onclick="loadStats()">↻ 更新</button>
          </div>
          <div class="empty">アクティブなルームはありません</div>
        </div>
      `;
    }

    container.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${s.totalRooms ?? '—'}</div>
            <div class="stat-label">総ルーム数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${(s.activeRooms ?? []).length}</div>
            <div class="stat-label">プレイ中ルーム</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${s.totalConnections ?? '—'}</div>
            <div class="stat-label">WebSocket接続数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${s.adminSessions ?? '—'}</div>
            <div class="stat-label">管理セッション数</div>
          </div>
        </div>
        ${activeRoomsHtml}
      </div>
    `;
  } catch (err) {
    container.innerHTML = `<div class="empty" style="color:var(--red)">読み込み失敗: ${esc(err.message)}</div>`;
  }
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
async function changePassword() {
  const cur = document.getElementById('pw-current').value;
  const nw  = document.getElementById('pw-new').value;
  const cnf = document.getElementById('pw-confirm').value;
  const msg = document.getElementById('pw-msg');

  msg.style.display = 'none';

  if (!cur || !nw || !cnf) {
    showMsg(msg, 'error', 'すべての項目を入力してください');
    return;
  }
  if (nw !== cnf) {
    showMsg(msg, 'error', '新しいパスワードが一致しません');
    return;
  }
  if (nw.length < 4) {
    showMsg(msg, 'error', 'パスワードは4文字以上にしてください');
    return;
  }

  try {
    await apiFetch('POST', `${API}/mjadmin/api/change-password`, { currentPassword: cur, newPassword: nw });
    showMsg(msg, 'success', 'パスワードを変更しました。再ログインしてください。');
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    document.getElementById('pw-confirm').value = '';
    setTimeout(() => doLogout(), 2500);
  } catch (err) {
    showMsg(msg, 'error', err.message);
  }
}

function showMsg(el, type, text) {
  el.className = `alert alert-${type}`;
  el.textContent = text;
  el.style.display = '';
}
</script>
